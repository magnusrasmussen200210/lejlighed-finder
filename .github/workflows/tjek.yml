name: Tjek lejligheder
on:
  # schedule slås til igen, når prøvekørslen ser rigtig ud
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kun log, send ikke Telegram"
        type: boolean
        default: false
concurrency:
  group: tjek
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.0
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Tjek sider
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANSOEGNING: ${{ secrets.ANSOEGNING }}
          KONTAKT_TELEFON: ${{ secrets.KONTAKT_TELEFON }}
          KONTAKT_EMAIL: ${{ secrets.KONTAKT_EMAIL }}
        run: python -m finder.main ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Gem hvilke annoncer der er set
        if: always()
        run: |
          git config user.name "lejlighed-finder"
          git config user.email "actions@users.noreply.github.com"
          [ -d state ] || exit 0
          git add state/
          git diff --cached --quiet || (git commit -qm "Opdater sete annoncer" && git push)
